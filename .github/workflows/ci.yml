name: Go and React CI

on: [push, pull_request]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24' # Matching the go.mod version

    - name: Build and Test Go Backend
      working-directory: ./nntp-browser-app/backend # Use working-directory for cleaner steps
      run: |
        go mod tidy
        go build -v ./...
        go test -v ./...

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Frontend Dependencies and Test
      working-directory: ./nntp-browser-app/frontend # Use working-directory
      run: |
        npm ci
        npm test
        npm run build # Optional: build the frontend to catch build errors
